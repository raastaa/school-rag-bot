<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ИИ-помощник директора школы</title>
  <style>
    :root { --blue:#2563eb; --ink:#172033; --muted:#64748b; --line:#dbe3ef; --bg:#f4f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; font:16px/1.5 Inter,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    header { padding:36px max(24px,calc((100vw - 1120px)/2)); color:white; background:linear-gradient(120deg,#0f3c87,#2563eb); }
    header h1 { margin:0 0 8px; font-size:34px; }
    header p { margin:0; opacity:.88; }
    main { max-width:1120px; margin:28px auto; padding:0 24px 48px; display:grid; grid-template-columns:360px 1fr; gap:24px; }
    section { background:white; border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 10px 30px rgba(15,23,42,.06); }
    h2 { margin:0 0 16px; font-size:20px; }
    input,textarea,button { width:100%; font:inherit; }
    input,textarea { border:1px solid var(--line); border-radius:10px; padding:12px; background:white; }
    textarea { min-height:110px; resize:vertical; }
    button { margin-top:12px; border:0; border-radius:10px; padding:12px 16px; color:white; background:var(--blue); font-weight:700; cursor:pointer; }
    button.danger { width:auto; margin:0; padding:7px 10px; background:#dc2626; font-size:13px; }
    .doc { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
    .doc small,.muted { color:var(--muted); }
    #answer { margin-top:18px; padding:18px; border-left:4px solid var(--blue); background:#eff6ff; white-space:pre-wrap; display:none; }
    details { margin-top:10px; padding:10px 0; border-top:1px solid var(--line); }
    .status { min-height:24px; margin-top:10px; color:var(--muted); }
    @media(max-width:800px){ main{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<header>
  <h1>ИИ-помощник директора школы</h1>
  <p>Ответы по загруженной нормативной и методической базе с указанием источников</p>
</header>
<main>
  <div>
    <section>
      <h2>Загрузка документа</h2>
      <input id="file" type="file" accept=".pdf,.docx,.txt,.md,.csv">
      <button onclick="uploadFile()">Загрузить и проиндексировать</button>
      <div id="uploadStatus" class="status"></div>
    </section>
    <section style="margin-top:24px">
      <h2>Документы</h2>
      <div id="documents" class="muted">Загрузка списка…</div>
    </section>
  </div>
  <section>
    <h2>Вопрос по базе знаний</h2>
    <textarea id="question" placeholder="Например: какие условия рекомендуются для организации здоровьесберегающей среды?"></textarea>
    <button onclick="askQuestion()">Найти ответ</button>
    <div id="askStatus" class="status"></div>
    <div id="answer"></div>
    <div id="sources"></div>
  </section>
</main>
<script>
async function api(url, options={}) {
  const response = await fetch(url, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.detail || 'Ошибка запроса');
  return data;
}
async function loadDocuments(){
  const docs = await api('/documents');
  const root=document.getElementById('documents');
  root.innerHTML=docs.length?'':'Документы пока не загружены';
  docs.forEach(d=>{
    const row=document.createElement('div'); row.className='doc';
    row.innerHTML=`<div><strong>${d.filename}</strong><br><small>${d.pages} стр. · ${d.chunks} фрагм.</small></div><button class="danger">Удалить</button>`;
    row.querySelector('button').onclick=async()=>{await api('/documents/'+d.id,{method:'DELETE'});loadDocuments();};
    root.appendChild(row);
  });
}
async function uploadFile(){
  const file=document.getElementById('file').files[0], status=document.getElementById('uploadStatus');
  if(!file){status.textContent='Выберите файл';return;}
  const form=new FormData();form.append('file',file);status.textContent='Идёт индексация…';
  try{const d=await api('/upload',{method:'POST',body:form});status.textContent=`Готово: ${d.chunks} фрагментов`;loadDocuments();}
  catch(e){status.textContent=e.message;}
}
async function askQuestion(){
  const q=document.getElementById('question').value, status=document.getElementById('askStatus');
  status.textContent='Ищу релевантные фрагменты…';
  try{
    const d=await api('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,top_k:4})});
    status.textContent=''; const answer=document.getElementById('answer');answer.style.display='block';answer.textContent=d.answer;
    const sources=document.getElementById('sources');sources.innerHTML='<h3>Источники</h3>';
    d.sources.forEach((s,i)=>{const el=document.createElement('details');el.innerHTML=`<summary>${i+1}. ${s.filename}, стр. ${s.page} · релевантность ${s.score}</summary><p>${s.text}</p>`;sources.appendChild(el);});
  }catch(e){status.textContent=e.message;}
}
loadDocuments();
</script>
</body>
</html>
